<!doctype html><html><head><style>body{margin:50px;background:#10172a;color:white;font:28px Arial}button{font:inherit;padding:20px;margin:20px}button:focus{outline:6px solid cyan}video{width:640px;height:360px;background:black}</style></head><body><h1>CTV browser QA fixture</h1><button id="home">Home</button><button id="play">Play</button><p>ArrowRight, then Enter. Keyboard only.</p><video id="video" muted></video><canvas hidden id="canvas" width="640" height="360"></canvas><script>
const home=document.querySelector('#home'),play=document.querySelector('#play'),video=document.querySelector('#video'),canvas=document.querySelector('#canvas');const ctx=canvas.getContext('2d');let frame=0;setInterval(()=>{ctx.fillStyle=frame++%2?'#2b4':'#24b';ctx.fillRect(0,0,640,360);ctx.fillStyle='white';ctx.font='48px Arial';ctx.fillText('Live frame '+frame,50,180)},30);video.srcObject=canvas.captureStream(30);play.onclick=()=>video.play();home.focus();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')play.focus();if(e.key==='Escape')video.pause()});</script></body></html>
